<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #16202c;
        --ink-soft: #55606d;
        --line: #e2e6ea;
        --accent: #2f6f6a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 1px 2px rgba(22, 32, 44, 0.06),
          0 8px 24px rgba(22, 32, 44, 0.06);
        padding: 24px;
        max-width: 360px;
        width: 100%;
        text-align: center;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: var(--ink-soft);
        margin: 0 0 20px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline</h1>
      <p>Your ledger is safe. Reconnect to open it.</p>
      <a href="/home">Try again</a>
    </div>
  </body>
</html>
