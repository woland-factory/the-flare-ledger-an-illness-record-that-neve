name: the-flare-ledger-an-illness-record-that-neve-staging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: the-flare-ledger-an-illness-record-that-neve-staging-web
    expose:
      - "80"
    environment:
      DATABASE_URL: postgresql://flare:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/flare?schema=public
      APP_URL: ${APP_URL:-http://localhost}
      SEED_DEMO: "1"
      SENTRY_DSN: ${SENTRY_DSN:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [default, staging]
    mem_limit: 512m
    oom_score_adj: 800
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: flare
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [default]
    mem_limit: 256m
    oom_score_adj: 800
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare -d flare"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:

networks:
  staging:
    external: true
    name: factory-staging-net
