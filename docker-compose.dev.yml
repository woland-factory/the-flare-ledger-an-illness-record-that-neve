name: the-flare-ledger-an-illness-record-that-neve-dev

services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl && npm install && npx prisma generate && npm run dev -- -p 3000 -H 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://flare:flare@db:5432/flare?schema=public
      APP_URL: http://localhost:3000
      SEED_DEMO: "1"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      # Bind to loopback only; a published 0.0.0.0 port bypasses the firewall.
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: flare
      POSTGRES_DB: flare
    volumes:
      - dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare -d flare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dev_db_data:
